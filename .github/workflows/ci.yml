name: API CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: local_offers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d local_offers_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LOCAL_OFFERS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/local_offers_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: PostGIS integration tests
        run: go test -tags=integration ./internal/repositories

      - name: Check core package coverage
        run: |
          go test -coverprofile=core-coverage.out ./internal/auth ./internal/services ./internal/handlers
          go tool cover -func=core-coverage.out
          total=$(go tool cover -func=core-coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v total="$total" 'BEGIN { if (total + 0 < 70) exit 1 }'

